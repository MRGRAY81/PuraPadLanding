<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PuraPad — Buy · Rent · Stay</title>
  <meta

    content="PuraPad is the PuraWorld home for buying, renting, and short stays — homes that work for you, not just the market."
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg-top: #1d0f39;
      --bg-mid: #7c4ddc;
      --bg-bottom: #1d0f39;
      --card-bg: rgba(8, 8, 20, 0.82);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent: #f6c94c;
      --accent-soft: rgba(246, 201, 76, 0.14);
      --text-main: #ffffff;
      --text-soft: rgba(255, 255, 255, 0.8);
      --pill-bg: rgba(15, 15, 35, 0.9);
      --nav-bg: rgba(8, 8, 20, 0.9);
      --shadow-soft: 0 24px 60px rgba(0, 0, 0, 0.45);
      --radius-lg: 999px;
      --radius-card: 24px;
      --radius-pill: 999px;
      --border-subtle: 1px solid rgba(255, 255, 255, 0.08);
      --transition-fast: 180ms ease-out;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-main);
      background: radial-gradient(circle at top left, #9b3af9 0, transparent 55%),
        radial-gradient(circle at bottom right, #1da3f3 0, transparent 55%),
        linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 40%, var(--bg-bottom) 100%);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }

    .page-wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 16px 16px 40px;
    }

    /* HEADER / NAV */

    header {
      position: sticky;
      top: 0;
      z-index: 40;
      backdrop-filter: blur(18px);
      background: linear-gradient(
        90deg,
        rgba(10, 10, 24, 0.96),
        rgba(10, 10, 24, 0.92)
      );
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.55);
      margin-bottom: 24px;
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 12px;
      background: radial-gradient(circle at 30% 0%, #f9e9ff 0, #9b3af9 45%, #1d0f39 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .brand-logo img {
      width: 110%;
      height: auto;
      display: block;
    }

    .brand-text-main {
      font-weight: 700;
      letter-spacing: 0.03em;
      font-size: 1.05rem;
    }

      font-size: 0.7rem;
      text-transform: uppercase;
